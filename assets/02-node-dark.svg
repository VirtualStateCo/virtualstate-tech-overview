<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 484" role="img" aria-labelledby="title desc"><title id="title">Del servidor al entorno persistente</title><desc id="desc">VirtualState Compute coordina el nodo; el gestor de sandbox, guest agent y Memory Vault mantienen el arnés; se reportan métricas y eventos firmados.</desc><defs><marker id="a-cyan" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#22d3ee"/></marker><marker id="a-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#a78bfa"/></marker><marker id="a-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#34d399"/></marker><marker id="a-line" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#435472"/></marker><marker id="a-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#fb7185"/></marker><marker id="a-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#fbbf24"/></marker></defs><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="678" height="482" rx="18" fill="#101a2d" stroke="#435472" stroke-width="1.5"/><rect x="100" y="24" width="480" height="72" rx="12" fill="#17243b" stroke="#a78bfa" stroke-width="1.5"/><text x="340.0" y="56.0" text-anchor="middle" font-size="23" font-weight="700" fill="#a78bfa">VirtualState Compute</text><text x="340.0" y="80.0" text-anchor="middle" font-size="17" font-weight="500" fill="#a9b6cd">API · políticas · ofertas · atestación</text><path d="M340 98 V142" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)" marker-start="url(#a-purple)"/><text x="358" y="124" text-anchor="start"