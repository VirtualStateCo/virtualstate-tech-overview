<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 484" role="img" aria-labelledby="title desc"><title id="title">Privacidad por capas y confianza dividida</title><desc id="desc">El cliente y el servicio de atestación aportan material efímero al sandbox; las claves se protegen en Memory Vault y los snapshots se cifran.</desc><defs><marker id="a-cyan" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#0e7490"/></marker><marker id="a-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#6543bc"/></marker><marker id="a-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#047857"/></marker><marker id="a-line" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#a4b2c7"/></marker><marker id="a-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#be123c"/></marker><marker id="a-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#946000"/></marker></defs><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="678" height="482" rx="18" fill="#f4f7fb" stroke="#a4b2c7" stroke-width="1.5"/><rect x="26" y="27" width="298" height="72" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/><text x="175.0" y="59.0" text-anchor="middle" font-size="23" font-weight="700" fill="#0e7490">Cliente</text><text x="175.0" y="83.0" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Verifica atestación</text><rect x="356" y="27" width="298" height="72" rx="12" fill="#ffffff" stroke="#6543bc" stroke-width="1.5"/><text x="505.0" y="59.0" text-anchor="middle" font-size="23" font-weight="700" fill="#6543bc">VirtualState</text><text x="505.0" y="83.0" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Valida política / TPM</text><path d="M175 99 V130 H274 V160" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><path d="M505 99 V130 H406 V160" fill="none" stroke="#6543bc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><text x="340" y="147" text-anchor="middle" font-size="18" font-weight="700" fill="#46546c">Split trust</text><rect x="66" y="163" width="548" height="213" rx="14" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="340" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#047857">Sandbox aprobado</text><text x="340" y="221" text-anchor="middle" font-size="18" font-weight="500" fill="#46546c">Semilla efímera por época</text><rect x="91" y="242" width="498" height="106" rx="10" fill="#f4f7fb" stroke="#047857" stroke-width="1.5"/><text x="340" y="271" text-anchor="middle" font-size="24" font-weight="700" fill="#047857">Memory Vault</text><rect x="111" y="288" width="148" height="42" rx="7" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/><text x="185" y="315" text-anchor="middle" font-size="17" font-weight="600" fill="#0e7490">Fragmentos</text><rect x="266" y="288" width="148" height="42" rx="7" fill="#ffffff" stroke="#6543bc" stroke-width="1.5"/><text x="340" y="315" text-anchor="middle" font-size="17" font-weight="600" fill="#6543bc">Rotación</text><rect x="421" y="288" width="148" height="42" rx="7" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="495" y="315" text-anchor="middle" font-size="17" font-weight="600" fill="#047857">Borrado</text><path d="M340 377 V408" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="115" y="410" width="450" height="47" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/><text x="340.0" y="440.5" text-anchor="middle" font-size="23" font-weight="700" fill="#0e7490">Snapshots cifrados</text><text x="340" y="476" text-anchor="middle" font-size="16" font-weight="600" fill="#46546c">Mitigación host-resistant ≠ cifrado de RAM en uso</text></g></svg>