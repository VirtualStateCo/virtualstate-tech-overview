<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 484" role="img" aria-labelledby="title desc"><title id="title">Redundancia por pares y tríos</title><desc id="desc">El mismo flujo externo alimenta réplicas. Dos hosts protegen de caídas; tres permiten comparar hashes y reparar una divergencia individual.</desc><defs><marker id="a-cyan" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#0e7490"/></marker><marker id="a-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#6543bc"/></marker><marker id="a-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#047857"/></marker><marker id="a-line" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#a4b2c7"/></marker><marker id="a-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#be123c"/></marker><marker id="a-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#946000"/></marker></defs><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="678" height="482" rx="18" fill="#f4f7fb" stroke="#a4b2c7" stroke-width="1.5"/><text x="25" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0e7490">NIVEL 1  /  DISPONIBILIDAD</text><rect x="185" y="45" width="310" height="50" rx="12" fill="#ffffff" stroke="#6543bc" stroke-width="1.5"/><text x="340.0" y="77.0" text-anchor="middle" font-size="23" font-weight="700" fill="#6543bc">Stream LLM único</text><path d="M340 95 V111 H170 V131" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><path d="M340 95 V111 H510 V131" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><rect x="33" y="134" width="274" height="69" rx="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="170.0" y="164.5" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">Nodo A · principal</text><text x="170.0" y="188.5" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Ejecuta acciones</text><rect x="373" y="134" width="274" height="69" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/><text x="510.0" y="164.5" text-anchor="middle" font-size="23" font-weight="700" fill="#0e7490">Nodo B · réplica</text><text x="510.0" y="188.5" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Estado sincronizado</text><path d="M309 169 H371" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)" marker-start="url(#a-green)" stroke-dasharray="6 6"/><text x="340" y="224" text-anchor="middle" font-size="18" font-weight="600" fill="#46546c">Si A cae, B retoma y se restaura el par.</text><path d="M25 241 H655" fill="none" stroke="#a4b2c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="269" text-anchor="start" font-size="17" font-weight="700" fill="#6543bc">NIVEL 2  /  CONGRUENCIA</text><rect x="185" y="283" width="310" height="47" rx="12" fill="#ffffff" stroke="#6543bc" stroke-width="1.5"/><text x="340.0" y="313.5" text-anchor="middle" font-size="23" font-weight="700" fill="#6543bc">Stream LLM único</text><path d="M340 330 V340 H116 V357" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><path d="M340 330 V357" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><path d="M340 340 H564 V357" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><rect x="24" y="360" width="184" height="67" rx="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="116.0" y="389.5" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">Nodo A</text><text x="116.0" y="413.5" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Hash α</text><rect x="248" y="360" width="184" height="67" rx="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="340.0" y="389.5" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">Nodo B</text><text x="340.0" y="413.5" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Hash α</text><rect x="472" y="360" width="184" height="67" rx="12" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/><text x="564.0" y="389.5" text-anchor="middle" font-size="23" font-weight="700" fill="#be123c">Nodo C</text><text x="564.0" y="413.5" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Hash β</text><path d="M208 393 H248" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)" marker-start="url(#a-green)" stroke-dasharray="6 6"/><path d="M432 393 H472" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)" stroke-dasharray="6 6"/><text x="340" y="453" text-anchor="middle" font-size="20" font-weight="700" fill="#047857">A = B ≠ C  →  aislar, restaurar y verificar C</text><text x="340" y="475" text-anchor="middle" font-size="16" font-weight="500" fill="#46546c">Sin mayoría coincidente: pausa y recuperación.</text></g></svg>