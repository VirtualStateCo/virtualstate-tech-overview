<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 484" role="img" aria-labelledby="title desc"><title id="title">Garantías medibles de disponibilidad</title><desc id="desc">Una licencia define las condiciones de uso. El nodo ejecuta, los oráculos miden y un contrato aplica el remedio acordado.</desc><defs><marker id="a-cyan" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#0e7490"/></marker><marker id="a-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#6543bc"/></marker><marker id="a-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#047857"/></marker><marker id="a-line" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#a4b2c7"/></marker><marker id="a-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#be123c"/></marker><marker id="a-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#946000"/></marker></defs><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="678" height="482" rx="18" fill="#f4f7fb" stroke="#a4b2c7" stroke-width="1.5"/><rect x="60" y="24" width="560" height="75" rx="12" fill="#ffffff" stroke="#6543bc" stroke-width="1.5"/><text x="340.0" y="57.5" text-anchor="middle" font-size="23" font-weight="700" fill="#6543bc">Licencia computacional</text><text x="340.0" y="81.5" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Recursos · duración · disponibilidad · política</text><path d="M340 100 V137" fill="none" stroke="#6543bc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/><rect x="60" y="140" width="560" height="72" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/><text x="340.0" y="172.0" text-anchor="middle" font-size="23" font-weight="700" fill="#0e7490">VirtualState Node</text><text x="340.0" y="196.0" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Arnés persistente · heartbeat · eventos firmados</text><path d="M340 213 V250" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><rect x="60" y="253" width="560" height="72" rx="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><text x="340.0" y="285.0" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">Oráculos de disponibilidad</text><text x="340.0" y="309.0" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Sondas externas · evidencia · discrepancias</text><path d="M340 326 V363" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="60" y="366" width="560" height="72" rx="12" fill="#ffffff" stroke="#946000" stroke-width="1.5"/><text x="340.0" y="398.0" text-anchor="middle" font-size="23" font-weight="700" fill="#946000">Smart contract</text><text x="340.0" y="422.0" text-anchor="middle" font-size="17" font-weight="500" fill="#46546c">Crédito · extensión · compensación según SLA</text><text x="340" y="468" text-anchor="middle" font-size="17" font-weight="600" fill="#46546c">Garantía contractual, no garantía de ausencia de fallos.</text></g></svg>